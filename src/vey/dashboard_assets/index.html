<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vey · 运维工作台</title><link rel="stylesheet" href="/admin/assets/style.css"><script src="/admin/assets/app.js" defer></script></head>
<body>
<aside class="sidebar"><a class="brand" href="/admin/"><span class="mark">V</span>Vey<span class="edition">CONSOLE</span></a><p class="nav-label">工作空间</p><div class="nav-active">◉<span>任务与审计</span></div><div class="sidebar-bottom"><span class="dot"></span>个人服务器<span class="muted">只读工作台 · 第三期</span></div></aside>
<main>
<header><span class="breadcrumb">工作空间 <span>/</span> 任务与审计</span><button id="logout" class="quiet" hidden>退出登录 ↗</button></header>
<section id="login-view" class="login-card"><div class="eyebrow">YOUR OPERATIONS, IN CONTEXT</div><h1>每次执行，都有据可查。</h1><p>登录 Vey 工作台，查看任务进度、诊断证据与操作记录。</p><form id="login-form"><label for="password">管理员登录口令</label><input id="password" type="password" autocomplete="current-password" required maxlength="256" placeholder="输入独立的后台登录口令"><button class="primary" type="submit">进入工作台 →</button></form><p class="footnote">会话闲置 15 分钟后失效。操作确认仍在企业微信完成。</p></section>
<section id="workspace" hidden>
<div class="page-heading"><div><div class="eyebrow">OPERATIONS / ACTIVITY</div><h1>任务与审计</h1><p>从一次请求，追溯到每一步证据。</p></div><button id="refresh" class="secondary">↻ 刷新记录</button></div>
<div id="stats" class="stats"></div>
<div class="toolbar"><div><h2>最近任务</h2><span id="list-caption" class="muted">当前保留的审计记录</span></div><label class="filter">状态<select id="status"><option value="">全部状态</option><option value="succeeded">已完成</option><option value="failed">失败</option><option value="partial">部分完成</option><option value="awaiting_confirmation">待确认</option><option value="unknown">结果未知</option><option value="running">执行中</option><option value="queued">排队中</option><option value="control_queued">控制队列</option><option value="cancelled">已取消</option></select></label></div>
<div class="work-grid"><section class="task-panel" aria-label="任务列表"><div id="tasks"></div><button id="more" class="load-more" hidden>加载更早记录 ↓</button></section><section id="detail" class="detail-panel" aria-live="polite"><div class="empty"><span class="empty-icon">◎</span><h2>选择一个任务</h2><p>查看执行时间线、证据摘要和操作状态。</p></div></section></div>
<footer>展示当前保留数据，常规审计保留 30 天。日志仅有有限摘要；没有记录的耗时或用量显示为未知。</footer>
</section>
<div id="notice" role="status" aria-live="polite" hidden></div>
</main></body></html>
