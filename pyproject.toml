[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vey-agent"
version = "0.1.0"
description = "A bounded, auditable WeCom operations agent"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic-settings>=2.8,<3",
  "httpx>=0.28,<1", "sqlalchemy>=2.0.40,<3", "psycopg[binary]>=3.2,<4",
  "alembic>=1.15,<2", "docker>=7.1,<8",
  "cryptography>=44", "defusedxml>=0.7,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]

[project.scripts]
vey = "vey.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/vey"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["postgres: requires VEY_TEST_DATABASE_URL and an isolated PostgreSQL database"]

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = [".tools", ".local", ".venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
