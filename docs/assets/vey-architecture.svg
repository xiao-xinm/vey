<text x="494" y="500" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="26" fill="#2863cd">Agent 核心 / agent-core</text>
<text x="494" y="532" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="18" fill="#506078">app.py → Core → bounded diagnosis</text>
<text x="494" y="574" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="21" fill="#16243b">身份校验、去重与任务队列</text>
<text x="494" y="605" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="21" fill="#16243b">规则优先，必要时调用模型</text>
<text x="494" y="636" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="21" fill="#16243b">最多 5 次只读工具 / 60 秒</text>
<text x="494" y="667" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="21" fill="#16243b">结构化证据、中文结果、Outbox</text>
<text x="494" y="698" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="21" fill="#16243b">不挂载 Docker socket</text>
<rect x="1040" y="450" width="430" height="300" rx="16" fill="white" stroke="#d6dfea" stroke-width="2"/>
<rect x="1040" y="450" width="7" height="300" rx="3" fill="#19785a"/>
<text x="1064" y="500" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="26" fill="#19785a">受控执行器 / ops-executor</text>
<text x="1064" y="532" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="18" fill="#506078">固定工具 + 独立权限检查</text>
<text x="1064" y="574" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="21" fill="#16243b">只读查询与启停重启</text>
<text x="1064" y="605" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="21" fill="#16243b">保护对象、会话、容器身份复核</text>
<text x="1064" y="636" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="21" fill="#16243b">两分钟确认；未知结果不重放</text>
<text x="1064" y="667" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="21" fill="#16243b">配置版本、预览、发布与回滚</text>
<text x="1064" y="698" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="21" fill="#16243b">唯一持有 Docker socket 的组件</text>
