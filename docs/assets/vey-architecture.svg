<text x="94" y="1002" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="18" fill="#506078">evaluation/ · 独立运行</text>
<text x="94" y="1044" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="21" fill="#16243b">案例 → 模型 → 契约评分</text>
