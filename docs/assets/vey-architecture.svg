<text x="494" y="1002" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="18" fill="#506078">同一现有 PG 实例 · 角色隔离</text>
<text x="494" y="1044" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="21" fill="#16243b">vey_core：会话 / 任务 / 事件 / 投递</text>
<text x="494" y="1075" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="21" fill="#16243b">vey_exec：确认 / 游标 / 配置版本</text>
<text x="494" y="1106" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="21" fill="#16243b">vey_eval：实验与逐条样本</text>
<text x="494" y="1137" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="21" fill="#16243b">后台读投影视图及评测只读账号</text>
<rect x="1040" y="920" width="430" height="245" rx="16" fill="white" stroke="#d6dfea" stroke-width="2"/>
<rect x="1040" y="920" width="7" height="245" rx="3" fill="#19785a"/>
<text x="1064" y="970" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="26" fill="#19785a">Ubuntu / 受管理容器</text>
<text x="1064" y="1002" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="18" fill="#506078">既有 Docker Compose 服务</text>
<text x="1064" y="1044" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="21" fill="#16243b">仅操作登记对象，不提供任意 Shell</text>
<text x="1064" y="1075" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="21" fill="#16243b">PG / Redis / Agent 等对象受保护</text>
<text x="1064" y="1106" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="21" fill="#16243b">宿主机指标来自只读映射</text>
<text x="1064" y="1137" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="21" fill="#16243b">MinIO 是既有服务，不是 Agent 依赖</text>
<text x="70" y="1259" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="21" fill="#506078">维护边界：管理员脚本执行本机备份与隔离恢复；后台只读报告。定时、加密与异地备份仍延期。</text>
<text x="70" y="1295" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="19" fill="#506078">图中箭头表示调用或数据访问。执行器被攻破仍有高权限风险；权限分离不等于完整沙箱。</text>
</svg>