name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: isolated-ci-password
          POSTGRES_DB: vey_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      VEY_TEST_DATABASE_URL: postgresql+psycopg://postgres:isolated-ci-password@localhost:5432/vey_test
      VEY_MIGRATION_DATABASE_URL: postgresql+psycopg://postgres:isolated-ci-password@localhost:5432/vey_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install uv==0.12.19
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run alembic upgrade head
      - run: uv run pytest -q
      - run: uv run python -m vey.evaluation validate evals/datasets/phase2-v1.json
      - run: uv run python -m vey.evaluation run evals/datasets/phase2-v1.json --split dev --mode rules --output .local/evals/ci-rules
      - run: uv run python -m vey.evaluation trajectory evals/datasets/trajectories-v1.json --output .local/evals/ci-trajectories
      - run: uv run python -m vey.evaluation validate evals/datasets/m3-routing-v1.json
      - run: uv run python -m vey.evaluation trajectory evals/datasets/m3-trajectories-v1.json --output .local/evals/ci-release-trajectories
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evaluation-rules-report
          path: .local/evals/
          if-no-files-found: ignore
