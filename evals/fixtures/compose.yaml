x-fixture: &fixture
  image: ${VEY_FIXTURE_IMAGE:?Set an existing Python runtime image}
  pull_policy: never
  entrypoint: ["python", "/fixture/app.py"]
  user: "10001:10000"
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  mem_limit: 64m
  cpus: 0.25
  pids_limit: 16
  restart: "no"
  volumes: ["./app.py:/fixture/app.py:ro"]
  networks: [isolated]
  logging:
    driver: json-file
    options: {max-size: "1m", max-file: "1"}
services:
  exit:
    <<: *fixture
    environment: {FIXTURE_MODE: exit}
  dependency:
    <<: *fixture
    environment: {FIXTURE_MODE: dependency}
  config:
    <<: *fixture
    environment: {FIXTURE_MODE: config}
networks:
  isolated:
    internal: true
